apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-slow-registry
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-slow-registry
  template:
    metadata:
      labels:
        app: app-slow-registry
    spec:
      containers:
      - name: app
        image: nginx:stable-alpine
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
      restartPolicy: Always

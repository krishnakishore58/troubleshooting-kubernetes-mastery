apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-private-image
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-private
  template:
    metadata:
      labels:
        app: app-private
    spec:
      containers:
      - name: app
        image: krishnakishore58/image_nginx:1.2  # <-- private registry (will fail)
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
      restartPolicy: Always

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-image-notfound
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-notfound
  template:
    metadata:
      labels:
        app: app-notfound
    spec:
      containers:
      - name: app
        image: nginx:1.1.1  # <-- typo or non-existent tag
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
      restartPolicy: Always
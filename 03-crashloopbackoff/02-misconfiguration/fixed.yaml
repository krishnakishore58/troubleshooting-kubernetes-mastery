apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-config
  namespace: crashloop-demo
  labels:
    app: bad-config
    scenario: "02-misconfiguration"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-config
  template:
    metadata:
      labels:
        app: bad-config
    spec:
      containers:
      - name: app
        image: busybox:1.36
        env:
        - name: APP_MODE
          value: "production"
        # FIX #1: provide the required CONFIG_PATH env var the app expects.
        - name: CONFIG_PATH
          value: "/etc/app/config.yaml"
        # FIX #2: call a binary that actually exists in the image ("/bin/sh")
        #         instead of the non-existent "serverd".
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Mode=$APP_MODE  Config=$CONFIG_PATH"
          echo "Server started."
          while true; do sleep 3600; done

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-config
  namespace: crashloop-demo
  labels:
    app: bad-config
    scenario: "02-misconfiguration"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-config
  template:
    metadata:
      labels:
        app: bad-config
    spec:
      containers:
      - name: app
        image: busybox:1.36
        # BUG #1: a required env var the app depends on is MISSING.
        #         The startup script hard-fails when CONFIG_PATH is unset.
        # BUG #2: the command references a binary that does NOT exist in the
        #         image ("serverd"). That produces exit code 127 (not found).
        env:
        - name: APP_MODE
          value: "production"
        command: ["serverd"]
        args: ["--config", "$(CONFIG_PATH)"]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-error
  namespace: crashloop-demo
  labels:
    app: app-error
    scenario: "01-application-error"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-error
  template:
    metadata:
      labels:
        app: app-error
    spec:
      containers:
      - name: app
        image: busybox:1.36
        # FIX: the real bug was in the application logic (it exited 1).
        # Here we simulate the corrected app: it starts and keeps running.
        # In the real world you would fix the code/config that caused exit 1,
        # not just keep the process alive.
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Starting payment-processor v1.4.3..."
          echo "Connected to database. Service ready."
          # Keep PID 1 alive (simulates a long-running server)
          while true; do sleep 3600; done

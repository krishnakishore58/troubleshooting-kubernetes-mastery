apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: crashloop-demo
data:
  # The real config lives under the key "app.conf".
  app.conf: |
    listen = 0.0.0.0:8080
    log_level = info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-dep
  namespace: crashloop-demo
  labels:
    app: missing-dep
    scenario: "05-missing-dependency"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-dep
  template:
    metadata:
      labels:
        app: missing-dep
    spec:
      # BUG: the pod declares NO volume for the config, yet the container
      # requires /etc/app/app.conf to exist at startup. The dependency the
      # app needs was never mounted. The startup check fails and the
      # container exits 1 -> CrashLoopBackOff.
      containers:
      - name: app
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Loading config from /etc/app/app.conf ..."
          if [ ! -f /etc/app/app.conf ]; then
            echo "FATAL: required config file /etc/app/app.conf not found" >&2
            exit 1
          fi
          echo "Config loaded. Starting."
          while true; do sleep 3600; done
        # NOTE: no volumeMounts here -> /etc/app/app.conf will never exist.

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: crashloop-demo
data:
  app.conf: |
    listen = 0.0.0.0:8080
    log_level = info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-dep
  namespace: crashloop-demo
  labels:
    app: missing-dep
    scenario: "05-missing-dependency"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-dep
  template:
    metadata:
      labels:
        app: missing-dep
    spec:
      # FIX: declare the ConfigMap as a volume so the file the app depends on
      # is actually present at the expected path.
      volumes:
      - name: config
        configMap:
          name: app-config
      containers:
      - name: app
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Loading config from /etc/app/app.conf ..."
          if [ ! -f /etc/app/app.conf ]; then
            echo "FATAL: required config file /etc/app/app.conf not found" >&2
            exit 1
          fi
          echo "Config loaded. Starting."
          while true; do sleep 3600; done
        # FIX: mount the ConfigMap at the path the app reads.
        volumeMounts:
        - name: config
          mountPath: /etc/app
          readOnly: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-app
  namespace: crashloop-demo
  labels:
    app: oom-app
    scenario: "04-oomkilled"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-app
  template:
    metadata:
      labels:
        app: oom-app
    spec:
      containers:
      - name: hungry
        image: busybox:1.36
        # BUG: the workload tries to allocate ~250Mi, but the memory LIMIT is
        # only 32Mi. The kernel OOM killer terminates the container the moment
        # it crosses the limit. Reason: OOMKilled, Exit Code: 137 (128 + SIGKILL 9).
        # Repeated OOM kills => CrashLoopBackOff.
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Allocating memory buffer..."
          # Fill a tmpfs-backed file in RAM to force the allocation.
          dd if=/dev/zero of=/dev/shm/fill bs=1M count=250
          echo "done"
          sleep 3600
        resources:
          requests:
            memory: "3Mi"
            cpu: "50m"
          limits:
            memory: "3Mi"   # BUG: far too low for the workload
            cpu: "100m"
